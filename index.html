<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descents</title>
  <meta name="description" content="Descents - a procedural first-person exploration game about descending into a vast abyss.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- shown only when opened from the file system (ES modules need a web server) -->
  <div id="file-warning" class="screen hidden">
    <div class="panel">
      <h1>Descents</h1>
      <p>This game uses JavaScript modules and web workers, which browsers block for pages opened directly from disk.</p>
      <p>Start a local web server in the game folder and open the address it prints:</p>
      <pre>npm start            (Node.js)
python3 -m http.server 8080</pre>
      <p>Then visit <b>http://localhost:8080</b>.</p>
    </div>
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').classList.remove('hidden');
  </script>

  <div id="ui"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
